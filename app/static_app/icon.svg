<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded app background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.7"/>

  <!-- Subtle map grid & street lines -->
  <g stroke="#334155" stroke-width="3" opacity="0.45" fill="none">
    <path d="M 48 160 Q 220 120 464 190"/>
    <path d="M 48 340 Q 260 390 464 310"/>
    <path d="M 155 48 Q 180 260 130 464"/>
    <path d="M 355 48 Q 330 260 385 464"/>
  </g>

  <!-- Playful 2x2 TZLM letter tiles -->
  <g filter="url(#softShadow)">
    <!-- T tile (emerald) -->
    <g transform="translate(162, 168) rotate(-6)">
      <rect x="-74" y="-74" width="148" height="148" rx="34" fill="#10b981"/>
      <rect x="-74" y="-74" width="148" height="148" rx="34" fill="none" stroke="#6ee7b7" stroke-width="4" opacity="0.6"/>
      <text x="0" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="96" fill="#ffffff">T</text>
    </g>

    <!-- Z tile (sky blue) -->
    <g transform="translate(342, 174) rotate(5)">
      <rect x="-74" y="-74" width="148" height="148" rx="34" fill="#38bdf8"/>
      <rect x="-74" y="-74" width="148" height="148" rx="34" fill="none" stroke="#bae6fd" stroke-width="4" opacity="0.65"/>
      <text x="0" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="96" fill="#0f172a">Z</text>
    </g>

    <!-- L tile (amber) -->
    <g transform="translate(170, 344) rotate(4)">
      <rect x="-74" y="-74" width="148" height="148" rx="34" fill="#f59e0b"/>
      <rect x="-74" y="-74" width="148" height="148" rx="34" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.65"/>
      <text x="0" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="96" fill="#0f172a">L</text>
    </g>

    <!-- M tile (violet/indigo) -->
    <g transform="translate(348, 340) rotate(-5)">
      <rect x="-74" y="-74" width="148" height="148" rx="34" fill="#818cf8"/>
      <rect x="-74" y="-74" width="148" height="148" rx="34" fill="none" stroke="#c7d2fe" stroke-width="4" opacity="0.6"/>
      <text x="0" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="92" fill="#ffffff">M</text>
    </g>
  </g>

  <!-- Playful map pin badge in the center -->
  <g transform="translate(256, 250)" filter="url(#softShadow)">
    <path d="M 0 -58 C -28 -58 -48 -36 -48 -10 C -48 22 0 60 0 60 C 0 60 48 22 48 -10 C 48 -36 28 -58 0 -58 Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="6"/>
    <!-- Tiny house roof / window inside pin -->
    <path d="M -16 -6 L 0 -20 L 16 -6 L 16 10 L 5 10 L 5 0 L -5 0 L -5 10 L -16 10 Z" fill="#ffffff"/>
  </g>
</svg>
