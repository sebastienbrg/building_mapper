[package]
name = "tezeloma"
version = "2.0.0"
description = "TeZeLoMa — Cartographie & Enquête Bailleurs"
authors = ["TeZeLoMa Team"]
license = "MIT"
repository = "https://github.com/sebastienbrg/tezeloma-assessment"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
